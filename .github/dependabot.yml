version: 2

updates:
  # GitHub Actions used by our workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci"
      include: "scope"

    cooldown:
      default-days: 7

  # vally skill linter (pinned to match github/awesome-copilot's marketplace gate)
  - package-ecosystem: "npm"
    directory: "/scripts/vally"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
    commit-message:
      prefix: "ci"
      include: "scope"
