name: Documentation
description: Report a problem with a SKILL.md, README, or other documentation
title: "[Docs]: "
labels: ["documentation"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to flag a documentation issue! **Problem in a `winui` or `winappcli` skill or agent?** Please [open it in microsoft/winappCli](https://github.com/microsoft/winappCli/issues/new/choose), where those plugins are authored. Use this form for this repo's README and docs.
  - type: textarea
    id: location
    attributes:
      label: Where is the issue?
      description: Link to the specific page, file, or section.
      placeholder: e.g. README.md, "Install" section
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What's wrong?
      description: Describe the documentation problem — broken link, wrong path, outdated example, missing step, unclear wording, etc.
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested fix
      description: If you have a concrete suggestion for how to fix it, share it here.
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Anything else we should know.
    validations:
      required: false
