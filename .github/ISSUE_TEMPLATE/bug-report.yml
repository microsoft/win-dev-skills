name: Bug report
description: Report a catalog or plugin install problem
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug report!

        **Problem with a WinUI skill, the `winui-dev` agent, WinApp CLI, or the analyzer?** Please [open an issue in microsoft/winappCli](https://github.com/microsoft/winappCli/issues/new/choose), where WinUI content is authored. Use this form for catalog and install problems (e.g. `plugin marketplace add`, `plugin install`, or `plugin update` fails).
  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Affected host
      description: Which agent host shows the problem?
      options:
        - Not sure
        - GitHub Copilot
        - Claude Code
        - OpenAI Codex
        - OpenClaw
        - OpenCode
        - Other
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: To Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Run `copilot plugin marketplace add microsoft/win-dev-skills`
        2. Run `copilot plugin install winui@win-dev-skills`
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: A clear and concise description of what you expected to happen.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Command output
      description: Paste the full output of the failing command.
      render: shell
    validations:
      required: false
  - type: input
    id: copilot-version
    attributes:
      label: Host version
      description: e.g. output of `copilot --version`, `claude --version`, or `codex --version`
      placeholder: e.g. 1.0.87
    validations:
      required: false
  - type: input
    id: plugin-version
    attributes:
      label: Plugin version
      description: From your host's plugin list (e.g. `copilot plugin list`)
      placeholder: e.g. 0.7.1
    validations:
      required: false
  - type: input
    id: os
    attributes:
      label: OS version
      description: e.g. Windows 11 23H2 (build 22631.4317)
    validations:
      required: false
  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Anything else that might help us reproduce or understand the issue.
    validations:
      required: false
