name: Feature request
description: Suggest a new skill, capability, or improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to suggest a new feature!

        If you're proposing a brand-new skill (e.g., "Add an XAML Behaviors skill"), include enough detail that someone else on the team or in the community could pick it up and implement it.
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the developer scenario you're trying to support and why the current skills/tools fall short.
      placeholder: e.g. When asking the agent to scaffold a charting page, it has no guidance on which charting library to use...
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe what you'd like to see — a new skill, an extension to an existing skill, a new tool, etc.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What other approaches did you consider, and why is the proposed solution better?
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Links to upstream docs, related issues, prior art, screenshots, or anything else that helps frame the request.
    validations:
      required: false
