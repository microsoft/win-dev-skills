trigger:
  branches:
    include:
      - main
      - dev/**
  tags:
    exclude:
      - '*'
pr: none

resources:
  repositories:
  - repository: 1esPipelines
    type: git
    name: 1ESPipelineTemplates/1ESPipelineTemplates
    ref: refs/tags/release

extends:
  template: v1/1ES.Official.PipelineTemplate.yml@1esPipelines
  parameters:
    # Keep source compliance scanning for the content plugin. Native tooling
    # builds and binary analysis belong to microsoft/winappCli.
    sdl:
      policheck:
        enabled: true
      sourceAnalysisPool:
        name: Azure-Pipelines-1ESPT-ExDShared
        image: windows-latest
        os: windows
    stages:
    - stage: Compliance
      jobs:
      - job: SourceChecks
        pool:
          name: Azure-Pipelines-1ESPT-ExDShared
          image: windows-latest
          os: windows
          hostArchitecture: amd64
        steps:
          - checkout: self
